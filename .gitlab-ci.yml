variables:
  # GitLab can only cache paths inside the project directory.
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

default:
  image: rust:latest
  cache:
    key: ${CI_JOB_NAME_SLUG}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

check:
  script:
    - cargo check --release

test:
  script:
    - curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/cargo/bin
    - cargo nextest run --all-features
    - cargo test --doc

msrv:
  image: rust:1.85
  script:
    - cargo check --release

cross-check:
  parallel:
    matrix:
      - TARGET:
          - armv7-unknown-linux-gnueabihf
          - thumbv6m-none-eabi
          - thumbv7em-none-eabihf
  cache:
    key: ${CI_JOB_NAME_SLUG}-${TARGET}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/
  script:
    - rustup target add ${TARGET}
    - cargo check --release --target=${TARGET} --no-default-features

fmt:
  cache: []
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

docs:
  image: rustlang/rust:nightly
  variables:
    RUSTDOCFLAGS: --cfg docsrs --generate-link-to-definition -Z unstable-options
  script:
    - cargo +nightly doc --all-features --no-deps

clippy:
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings
